<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniLab — Anime Library</title>
    <meta name="description" content="Your personal local anime library manager." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div id="app">

      <!-- ── Sidebar ─────────────────────────────────── -->
      <aside id="sidebar">
        <div id="brand">
          <span class="brand-icon"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg></span>
          <span class="brand-name">AniLab</span>
        </div>

        <nav id="nav">
          <button class="nav-btn active" id="nav-library" data-view="library">
            <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></span> Library
          </button>
          <button class="nav-btn" id="nav-search" data-view="search">
            <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span> Search
          </button>
          <button class="nav-btn" id="nav-settings" data-view="settings">
            <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span> Settings
          </button>
        </nav>

        <div id="sidebar-footer">
          <button id="scan-btn" class="action-btn">
            <span><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></span> Scan Folder
          </button>
        </div>
      </aside>

      <!-- ── Main content ───────────────────────────── -->
      <main id="main">

        <!-- Library view -->
        <section id="view-library" class="view active">
          <header class="view-header">
            <h1>My Library</h1>
            <span id="library-count" class="badge"></span>
          </header>
          <div id="library-grid" class="card-grid">
            <div class="empty-state" id="library-empty">
              <span class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg></span>
              <p>Your library is empty.</p>
              <p class="empty-sub">Scan a folder to get started.</p>
            </div>
          </div>
        </section>

        <!-- Search view -->
        <section id="view-search" class="view">
          <header class="view-header">
            <h1>Search Anime</h1>
          </header>
          <div class="search-bar-wrap">
            <input
              id="search-input"
              class="search-input"
              type="text"
              placeholder="Search for an anime…"
              autocomplete="off"
            />
          </div>
          <div id="search-grid" class="card-grid">
            <div class="empty-state" id="search-empty">
              <span class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
              <p>Type to search AniList.</p>
            </div>
          </div>
        </section>

        <!-- Settings view -->
        <section id="view-settings" class="view">
          <header class="view-header">
            <h1>Settings</h1>
          </header>
          <div class="settings-body">
            <label class="settings-label">Scan Folder Path</label>
            <div class="settings-row">
              <input id="folder-path-input" class="text-input" type="text" placeholder="/home/user/Videos" />
              <button id="settings-scan-btn" class="primary-btn">Scan &amp; Import</button>
            </div>
            <p id="scan-status" class="scan-status"></p>
          </div>
        </section>

      </main>

      <!-- ── Episode detail panel (slide-in) ──────── -->
      <div id="detail-overlay" class="overlay hidden"></div>
      <aside id="detail-panel" class="detail-panel hidden">
        <button id="detail-close" class="close-btn">✕</button>
        <div id="detail-content"></div>
      </aside>

      <!-- ── Toast ─────────────────────────────────── -->
      <div id="toast" class="toast hidden"></div>

    </div>
  </body>
</html>
